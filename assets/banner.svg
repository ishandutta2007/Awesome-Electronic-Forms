<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 54px; fill: url(#text-gradient); }
    .subtitle { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Dynamic Animated Elements */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-orb { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .floating-card { animation: float 4s infinite ease-in-out; }
    .animated-line { stroke-dasharray: 10, 10; animation: dash 3s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)" />
  
  <!-- Dynamic Pulsing Background Orbs -->
  <circle class="pulsing-orb" cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle class="pulsing-orb" cx="1000" cy="220" r="160" fill="#c084fc" opacity="0.15" filter="url(#glow)" stroke="" />

  <!-- Animated Connection Line -->
  <path class="animated-line" d="M 150 150 Q 400 50 600 150 T 1050 150" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.4" />

  <!-- Left Icon / Decorative Element (Dynamic Floating Card) -->
  <g class="floating-card" transform="translate(80, 75)">
    <rect width="130" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#glow)"/>
    <rect x="15" y="20" width="70" height="12" rx="4" fill="#38bdf8" />
    <rect x="15" y="45" width="100" height="8" rx="3" fill="#64748b" />
    <rect x="15" y="62" width="85" height="8" rx="3" fill="#64748b" />
    <!-- Checkboxes -->
    <rect x="15" y="85" width="14" height="14" rx="3" fill="#818cf8" />
    <path d="M 18 92 L 21 95 L 26 88" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <rect x="38" y="88" width="60" height="8" rx="3" fill="#94a3b8" />
    
    <rect x="15" y="110" width="14" height="14" rx="3" fill="#334155" />
    <rect x="38" y="113" width="70" height="8" rx="3" fill="#64748b" />
  </g>

  <!-- Right Decorative Element -->
  <g class="floating-card" transform="translate(980, 65)">
    <circle cx="70" cy="70" r="60" fill="#0f172a" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>
    <!-- Analytics chart inside orb -->
    <path d="M 35 90 L 55 70 L 70 80 L 100 45" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="100" cy="45" r="5" fill="#c084fc" />
  </g>

  <!-- Center Content -->
  <g transform="translate(260, 110)">
    <text x="0" y="35" class="title" filter="url(#glow)">Awesome Electronic Forms</text>
    <text x="0" y="75" class="subtitle">Curated SaaS Platforms &amp; Open-Source Survey/Form Builders</text>
    
    <!-- Feature Pills -->
    <g transform="translate(0, 105)">
      <rect width="130" height="28" rx="14" fill="#334155" opacity="0.8"/>
      <text x="65" y="19" text-anchor="middle" class="badge-text">⚡ Form Builders</text>
      
      <rect x="142" y="0" width="120" height="28" rx="14" fill="#334155" opacity="0.8"/>
      <text x="202" y="19" text-anchor="middle" class="badge-text">📊 Surveys &amp; Logic</text>

      <rect x="274" y="0" width="135" height="28" rx="14" fill="#334155" opacity="0.8"/>
      <text x="341" y="19" text-anchor="middle" class="badge-text">🔓 Open Source</text>
      
      <rect x="421" y="0" width="115" height="28" rx="14" fill="#334155" opacity="0.8"/>
      <text x="478" y="19" text-anchor="middle" class="badge-text">💼 SaaS &amp; ARR</text>
    </g>
  </g>
</svg>
